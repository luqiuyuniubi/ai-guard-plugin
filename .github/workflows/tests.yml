name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK
        run: python -m pip install .
      - name: Run security regression tests
        run: python -m unittest discover -s tests -v
      - name: Run integration example
        run: python -m examples.embedded
      - name: Verify installed SDK outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from ai_guard import SecurityPlugin, Policy; SecurityPlugin({'demo': Policy()}); print('SDK import OK')"
